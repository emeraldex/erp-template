name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — types, tests, build, Section 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
      - name: Type check
        run: pnpm --filter api typecheck
      - name: Unit tests
        run: pnpm --filter api test:cov
      - name: Integration tests (PostgreSQL)
        run: pnpm --filter api test:e2e
      - name: Build
        run: pnpm --filter api build
      - name: Section 8 scenario against a running API
        env:
          DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_demo
          PGPASSWORD: erp
          PORT: "4000"
          WEB_ORIGIN: http://localhost:3000
        run: |
          psql -h localhost -U erp -d erp_test -c 'CREATE DATABASE erp_demo'
          export AUTH_SECRET="$(openssl rand -hex 32)"
          cd apps/api
          pnpm exec prisma migrate deploy
          node dist/seed-db.js
          node dist/main.js > ../../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break; sleep 1; done
          cd ../..
          python3 scripts/section8-demo.py
      - name: API log
        if: failure()
        run: cat api.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore

  web:
    name: Web — types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No install in this job, so no pnpm store to cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
