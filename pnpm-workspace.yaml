packages:
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  # Download analytics pulled in by swagger-ui; never let it phone home.
  '@scarf/scarf': false
  prisma: true
  sharp: true
  unrs-resolver: true

# Native build scripts we trust to run on install
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - prisma
  - '@prisma/engines'

# Security fixes for transitive dependencies that upstream still pins.
# Remove once Prisma ships with effect >= 3.22.1 (GHSA advisory on effect <= 3.22.0).
overrides:
  effect@<3.22.1: ^3.22.5
  # exceljs pins an old uuid (bounds-check advisory); 11.x keeps the same v4 API.
  uuid@<11.1.1: ^11.1.1
