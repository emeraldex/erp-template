packages:
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true

# Native build scripts we trust to run on install
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - prisma
  - '@prisma/engines'

# Security fixes for transitive dependencies that upstream still pins.
# Remove once Prisma ships with effect >= 3.22.1 (GHSA advisory on effect <= 3.22.0).
overrides:
  effect@<3.22.1: ^3.22.5
