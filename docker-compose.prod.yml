# ─── Maintenance ERP — production stack ────────────────────────────────────────────
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a .env.prod alongside this file (see .env.prod.example). Postgres is
# NOT published to the host: only the api service reaches it, over the internal
# network. Publish 5432 only if you need external DBA access, and firewall it.

name: maintenance-erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      # Fail fast on a weak/blank password rather than trusting the network.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.prod}
      AUTH_TTL_HOURS: ${AUTH_TTL_HOURS:-8}
      AUTH_IDLE_MINUTES: ${AUTH_IDLE_MINUTES:-60}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      # Hops of reverse proxy in front of the API (1 for a single nginx/Caddy).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Multi-client: refuse addresses that belong to no organisation.
      TENANT_STRICT_HOSTS: ${TENANT_STRICT_HOSTS:-false}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-Default}
      # The API reference at /api/docs is off in production unless enabled.
      API_DOCS: ${API_DOCS:-false}
      # Attachments: local volume by default, or any S3-compatible bucket.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      ATTACHMENTS_DIR: /app/data/attachments
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-20}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # SLA alerts (in-app; email when SMTP_URL is set) and archiving.
      ALERT_INTERVAL_MINUTES: ${ALERT_INTERVAL_MINUTES:-15}
      SLA_WARN_DAYS: ${SLA_WARN_DAYS:-1}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ARCHIVE_AFTER_DAYS: ${ARCHIVE_AFTER_DAYS:-365}
      ARCHIVE_INTERVAL_HOURS: ${ARCHIVE_INTERVAL_HOURS:-24}
      RETENTION_YEARS: ${RETENTION_YEARS:-5}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env.prod}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      RUN_MIGRATIONS: "1"
      # Seeds the reference dataset on an empty database; the script no-ops if
      # users already exist. Set to 0 once you load real data.
      RUN_SEED: ${RUN_SEED:-1}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Seeded users must choose their own password at first sign-in. Set to 0
      # only for a throwaway demo deployment.
      SEED_FORCE_PASSWORD_CHANGE: ${SEED_FORCE_PASSWORD_CHANGE:-1}
    volumes:
      - attachments:/app/data/attachments
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time — must be the URL the
        # user's browser can reach, not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.prod}
        # 1 = show bundled sample data when the API is down (sales demos only).
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    networks: [frontend]

  # Nightly verified pg_dump into ./backups on the host (see
  # docs/operations/backup-and-restore.md). Copy that directory off the server.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-erp}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/ops/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks: [backend]

  # Optional TLS reverse proxy (profile "proxy"): see deploy/Caddyfile.example.
  proxy:
    image: caddy:2-alpine
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [frontend]

volumes:
  pgdata:
  attachments:
  caddy-data:

networks:
  # db is reachable only from api; web never touches it.
  backend:
    internal: true
  frontend:
